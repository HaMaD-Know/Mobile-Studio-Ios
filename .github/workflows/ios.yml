# Builds the iOS port on a GitHub-hosted Mac (no Mac needed locally).
# Each run also produces an unsigned MobileStudio.ipa (see the run's Artifacts) that can be
# signed and installed from Windows with Sideloadly using a free Apple ID.
name: iOS build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Core unit tests
        run: swift test --package-path Packages/StudioCore
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen
      - name: Build for simulator
        run: |
          xcodebuild -project MobileStudio.xcodeproj -scheme MobileStudio \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build for device (unsigned)
        run: |
          xcodebuild -project MobileStudio.xcodeproj -scheme MobileStudio \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/MobileStudio.app
          test -d "$APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../MobileStudio.ipa Payload)
          ls -lh MobileStudio.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: MobileStudio-unsigned-ipa
          path: MobileStudio.ipa
          retention-days: 30
